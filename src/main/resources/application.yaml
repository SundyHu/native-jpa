server:
  port: 9000
spring:
  application:
    name: native-jpa
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
      ddl-auto: update
    generate-ddl: true
    properties:
      hibernate:
        highlight_sql: true
        format_sql: true
    open-in-view: false
logging:
  level:
    root: info
    sql: trace